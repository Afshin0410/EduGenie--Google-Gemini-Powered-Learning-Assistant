<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome to EduGenie</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main class="page">
      <section class="card">
        <header class="card-header">
          <p class="eyebrow">AI study companion</p>
          <h1>Welcome to EduGenie</h1>
          <p class="lede">
            Ask a question, get an explanation, summarize notes, take a quiz, or
            follow a learning path.
          </p>
        </header>

        <form id="edugenie-form" class="form">
          <label for="task">Task</label>
          <select id="task" name="task">
            <option value="qa">Q&amp;A</option>
            <option value="explain">Explain</option>
            <option value="summarize">Summarize</option>
            <option value="quiz">Quiz</option>
            <option value="learn">Learning Path</option>
          </select>

          <label for="input-text" id="input-label">Your question</label>
          <textarea
            id="input-text"
            name="input"
            rows="8"
            placeholder="Ask a question..."
          ></textarea>

          <button type="submit" id="submit-btn" class="btn">Submit</button>
        </form>
      </section>

      <section id="result" class="card result hidden" aria-live="polite"></section>
    </main>

    <script>
      const TASKS = {
        qa: {
          label: "Your question",
          placeholder: "Ask a question...",
          url: "/qa",
          field: "question",
          responseKey: "answer",
        },
        explain: {
          label: "Topic to explain",
          placeholder: "Enter a topic, e.g. photosynthesis",
          url: "/explain",
          field: "topic",
          responseKey: "explanation",
        },
        summarize: {
          label: "Text to summarize",
          placeholder: "Paste notes or a passage to summarize...",
          url: "/summarize",
          field: "text",
          responseKey: "summary",
        },
        quiz: {
          label: "Passage or topic for the quiz",
          placeholder: "Enter a topic or paste a passage...",
          url: "/quiz",
          field: "text",
          responseKey: "quiz",
        },
        learn: {
          label: "Topic for a learning path",
          placeholder: "Enter a topic, e.g. basic Python",
          url: "/learn/recommendations",
          field: "topic",
          responseKey: "recommendation",
        },
      };

      const form = document.getElementById("edugenie-form");
      const taskSelect = document.getElementById("task");
      const inputLabel = document.getElementById("input-label");
      const inputText = document.getElementById("input-text");
      const submitBtn = document.getElementById("submit-btn");
      const result = document.getElementById("result");

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function renderMarkdown(raw) {
        const lines = escapeHtml(raw).split(/\r?\n/);
        const html = [];
        let inList = false;

        const closeList = () => {
          if (inList) {
            html.push("</ul>");
            inList = false;
          }
        };

        const inline = (text) =>
          text.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");

        for (const line of lines) {
          const heading = line.match(/^#{1,3}\s+(.+)$/);
          const bullet = line.match(/^\s*[-*]\s+(.+)$/);

          if (heading) {
            closeList();
            html.push("<h3>" + inline(heading[1]) + "</h3>");
          } else if (bullet) {
            if (!inList) {
              html.push("<ul>");
              inList = true;
            }
            html.push("<li>" + inline(bullet[1]) + "</li>");
          } else if (line.trim() === "") {
            closeList();
            html.push("<br />");
          } else {
            closeList();
            html.push("<p>" + inline(line) + "</p>");
          }
        }
        closeList();
        return html.join("");
      }

      function errorHtml(message) {
        return '<p class="error">' + escapeHtml(message) + "</p>";
      }

      function parseError(payload, fallback) {
        if (!payload) return fallback;
        if (typeof payload.detail === "string") return payload.detail;
        if (Array.isArray(payload.detail) && payload.detail[0]?.msg) {
          return payload.detail[0].msg;
        }
        if (payload.error) return payload.error;
        return fallback;
      }

      function updateTaskUi() {
        const task = TASKS[taskSelect.value];
        inputLabel.textContent = task.label;
        inputText.placeholder = task.placeholder;
      }

      function setLoading(isLoading) {
        submitBtn.disabled = isLoading;
        submitBtn.textContent = isLoading ? "Working..." : "Submit";
      }

      function showResult(html) {
        result.innerHTML = html;
        result.classList.remove("hidden");
      }

      function renderQuiz(questions) {
        if (!Array.isArray(questions) || questions.length === 0) {
          return errorHtml("No quiz questions were returned.");
        }

        const blocks = questions
          .map((item, index) => {
            const name = "q" + index;
            const options = (item.options || [])
              .map((option, optIndex) => {
                const id = name + "-" + optIndex;
                const value = escapeHtml(option);
                return (
                  '<label class="option" for="' +
                  id +
                  '">' +
                  '<input type="radio" id="' +
                  id +
                  '" name="' +
                  name +
                  '" value="' +
                  value +
                  '" />' +
                  "<span>" +
                  value +
                  "</span></label>"
                );
              })
              .join("");

            return (
              '<article class="quiz-item" data-answer="' +
              escapeHtml(item.answer) +
              '">' +
              "<h3>Question " +
              (index + 1) +
              "</h3>" +
              "<p>" +
              escapeHtml(item.question) +
              "</p>" +
              '<div class="options">' +
              options +
              "</div>" +
              '<button type="button" class="btn btn-small check-answer">Check Answer</button>' +
              '<p class="feedback" hidden></p>' +
              "</article>"
            );
          })
          .join("");

        return "<h2>Quiz</h2>" + blocks;
      }

      result.addEventListener("click", (event) => {
        const button = event.target.closest(".check-answer");
        if (!button) return;

        const item = button.closest(".quiz-item");
        const selected = item.querySelector("input[type='radio']:checked");
        const feedback = item.querySelector(".feedback");
        const correct = item.dataset.answer;

        feedback.hidden = false;
        if (!selected) {
          feedback.className = "feedback error";
          feedback.textContent = "Please choose an answer first.";
          return;
        }

        if (selected.value === correct) {
          feedback.className = "feedback correct";
          feedback.textContent = "✅ Correct";
        } else {
          feedback.className = "feedback incorrect";
          feedback.textContent = "❌ Incorrect — the right answer is: " + correct;
        }
      });

      taskSelect.addEventListener("change", updateTaskUi);

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const task = TASKS[taskSelect.value];
        const value = inputText.value.trim();

        if (!value) {
          showResult(errorHtml("Please enter some text before submitting."));
          return;
        }

        setLoading(true);
        showResult('<p class="loading">Generating your result...</p>');

        try {
          const response = await fetch(task.url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ [task.field]: value }),
          });

          let data = {};
          try {
            data = await response.json();
          } catch (_jsonError) {
            data = {};
          }

          if (!response.ok) {
            showResult(
              errorHtml(parseError(data, "Something went wrong. Please try again."))
            );
            return;
          }

          if (taskSelect.value === "quiz") {
            showResult(renderQuiz(data.quiz));
            return;
          }

          const text = data[task.responseKey];
          if (!text) {
            showResult(errorHtml("The response did not include any content."));
            return;
          }

          const heading =
            taskSelect.value === "qa"
              ? "Answer"
              : taskSelect.value === "explain"
                ? "Explanation"
                : taskSelect.value === "summarize"
                  ? "Summary"
                  : "Learning path";

          showResult("<h2>" + heading + "</h2>" + renderMarkdown(text));
        } catch (error) {
          showResult(errorHtml("Could not reach the server. Please try again."));
        } finally {
          setLoading(false);
        }
      });

      updateTaskUi();
    </script>
  </body>
</html>
